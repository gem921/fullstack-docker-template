# 定义后端服务的 upstream（容器名:端口）
upstream backend {
    server backend:8080;  # 对应 docker-compose 里的后端服务名和端口
}

# 80 端口：把所有 http 请求 301 跳转到 https，避免明文传输
server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;  # 改成你的域名
    client_max_body_size 1024m;  # 上传大文件时按需调整

    # SSL 证书（文件名需与 ssl/ 目录中的证书一致）
    ssl_certificate /opt/nginx/ssl/fullchain.pem;
    ssl_certificate_key /opt/nginx/ssl/certkey.pem;

    # 单页面应用：静态资源 + 前端路由
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;  # SPA 刷新不 404
    }

    # 反向代理 API 请求到后端容器
    location /api/ {
        proxy_pass http://backend;                   # 容器内网转发用 http
        proxy_set_header Host $host;                 # 传递原始域名
        proxy_set_header X-Real-IP $remote_addr;     # 传递客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 告诉后端原始请求是 https
    }
}
